name: NextRole CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_DB: nextrole_test
          POSTGRES_USER: nextrole_test
          POSTGRES_PASSWORD: nextrole-ci-disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nextrole_test -d nextrole_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: PDF 추출 도구 설치
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Go 테스트와 정적 검사
        env:
          TEST_POSTGRES_DSN: postgres://nextrole_test:nextrole-ci-disposable@127.0.0.1:5432/nextrole_test?sslmode=disable
        run: |
          go test -race ./...
          go vet ./...
      - name: React 정적 번들 빌드
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: 브라우저 설치
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: 실제 화면 통합 검증
        env:
          POSTGRES_DSN: postgres://nextrole_test:nextrole-ci-disposable@127.0.0.1:5432/nextrole_test?sslmode=disable
          BOOTSTRAP_ADMIN: browser@example.test
          BOOTSTRAP_ADMIN_PASSWORD: nextrole-ci-browser-disposable
          NEXTROLE_TEST_ADMIN: browser@example.test
          NEXTROLE_TEST_PASSWORD: nextrole-ci-browser-disposable
        run: |
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          go build -o /tmp/nextrole-ci ./cmd/nextrole
          /tmp/nextrole-ci &
          nextrole_ci_pid=$!
          trap 'kill "$nextrole_ci_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          cd web
          npx playwright test
      - name: 서비스 이미지 빌드
        run: docker build --platform linux/amd64 --tag nextrole:ci .
      - name: 외부 통신 없는 환경에서 이미지 검증
        run: bash scripts/smoke-image.sh nextrole:ci
